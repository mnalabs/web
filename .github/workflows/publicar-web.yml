# Quan es puja un canvi a main, genera el web i en copia NOMÉS els fitxers públics
# al repositori públic mnalabs/web-publica, des d'on GitHub Pages serveix mnalabs.eu.
# El repositori d'aquest codi pot ser privat. Instruccions: PUBLICACIO.md
name: Publicar el web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Genera les pàgines
        run: node src/build.js

      - name: Prepara només els fitxers públics
        run: bash src/preparar-publicacio.sh "$RUNNER_TEMP/web-public"

      - name: Puja'ls al repositori públic
        env:
          CLAU_PUBLICACIO: ${{ secrets.CLAU_PUBLICACIO }}
          REPOSITORI_PUBLIC: mnalabs/web-publica
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAU_PUBLICACIO" > ~/.ssh/clau_publicacio
          chmod 600 ~/.ssh/clau_publicacio
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/clau_publicacio -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:${REPOSITORI_PUBLIC}.git" "$RUNNER_TEMP/destí"
          cd "$RUNNER_TEMP/destí"
          # substitueix tot el contingut pel nou (així els fitxers esborrats també desapareixen)
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/web-public/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Cap canvi a publicar."
          else
            git -c user.name="MNA LABS publicació" -c user.email="noreply@mnalabs.eu" \
              commit -m "Publicació del web (${GITHUB_SHA::7})"
            git push origin HEAD:main
          fi
