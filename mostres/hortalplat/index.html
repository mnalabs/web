/* HortAlPlat 2027 — cream paper, red for the main action, the logo's leaf green for everything secondary. Flat: no glass, no gradients. */
:root{
  --red:#F7403A;--red-ink:#C4231D;--red-soft:#FFE9E3;--leaf:#8CC63F;--leaf-ink:#2F6B0F;--leaf-soft:#EAF3D6;--blue:#1863DC;
  --dark:#262626;--bg:#FAF5EA;--fg:#1F1F1F;--card:#FFFDF8;--mist:#F1EADA;--mut:#5A564C;--line:#E6DFCE;
  --display:"DejaVu Sans Condensed","DejaVu Sans",Verdana,sans-serif;--ui:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --smooth:cubic-bezier(.22,1,.36,1);
  --spring:linear(0,.18 6%,.52 14%,.84 24%,1.05 36%,1.09 42%,1.04 54%,.99 68%,1 82%,1);
  /* Apple-style rebound: overshoots by ~16 % once, then settles (damping .5) */
  --bounce:linear(0,.073,.249,.468,.686,.874,1.015,1.107,1.153,1.163,1.147,1.116,1.08,1.045,1.016,.994,.981,.974,.974,.977,.982,.988,.994,.998,1.001,1.003,1.004,1.004,1.004,1.003,1.002,1.001,1,1,1);
  --hh:76px;--r:1.5rem;color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:112.5%;overflow-x:clip;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip;min-width:320px}
img,svg{max-width:100%}
a{color:var(--red-ink);text-underline-offset:.2em}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:.5rem}
h1,h2,h3,h4{font-family:var(--display);margin:0 0 .5em;text-wrap:balance;font-weight:700;overflow-wrap:break-word}
h1{font-size:clamp(2.3rem,5.6vw,4.4rem);letter-spacing:-.03em;line-height:1.02}
h2{font-size:clamp(1.8rem,3.6vw,2.8rem);letter-spacing:-.022em;line-height:1.08}
h3{font-size:1.35rem;letter-spacing:-.012em;line-height:1.2}
h4{font-size:1.1rem;line-height:1.25}
p{margin:0 0 1em;max-width:62ch;overflow-wrap:break-word}
.wrap{width:min(1200px,100% - 2rem);margin-inline:auto}
.sec{padding:clamp(4rem,9vw,8rem) 0}
.sec.tight{padding-top:0}
.eyebrow{font-family:var(--ui);font-weight:800;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf-ink);margin-bottom:.75rem;display:block}
.lead{font-size:1.2rem;line-height:1.55;color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:1rem;top:-5rem;background:var(--dark);color:#fff;padding:.8rem 1.2rem;border-radius:.8rem;z-index:200;font-family:var(--ui);font-weight:700}
.skip:focus{top:1rem}
/* a short green swoosh under section titles, like the leaf in the logo */
.shead h2::after,.stext h3::after{content:"";display:block;width:3rem;height:.4rem;margin-top:.7rem;border-radius:.4rem 0 .4rem 0;background:var(--leaf);transform:skewX(-14deg)}

/* ===== buttons: red = main action, leaf green = everything else ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;font-family:var(--ui);font-weight:700;font-size:1.05rem;line-height:1.2;border:0;border-radius:1rem;min-height:3.4rem;padding:.8rem 1.6rem;cursor:pointer;background:var(--red);color:#fff;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .4s var(--smooth),background .2s,box-shadow .2s}
.btn svg{width:1.35em;height:1.35em;flex:none}
.btn:active{transform:scale(.96);transition-duration:.08s}
.btn.green,.btn.ghost,.btn.dark,.btn.white,.btn.line{background:var(--leaf);color:#1d2a0a}
.btn.sm{min-height:2.8rem;padding:.5rem 1.1rem;font-size:.95rem;border-radius:.85rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
main .btn,.btn.block,.mnav .btn{white-space:normal;text-align:center}
@media (hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px -12px rgba(0,0,0,.45)}.btn.green:hover,.btn.ghost:hover,.btn.dark:hover,.btn.white:hover,.btn.line:hover{background:#9AD14C}}

/* ===== header: logo · every page name in one row · cart. Becomes a hamburger ONLY when it does not fit (JS adds .compact) ===== */
header.site{position:sticky;top:0;z-index:60;background:var(--card);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:.8rem;min-height:var(--hh)}
.hbar>*{flex:none}
.logo{display:block;line-height:0}
.logo img{height:2.4rem!important;width:auto;display:block}
nav.main{margin-left:auto;display:flex;align-items:center;gap:.1rem;font-family:var(--ui);font-weight:700;font-size:.95rem}
nav.main>a{color:var(--fg);padding:.7rem .5rem;border-radius:.8rem;text-decoration:none;position:relative;white-space:nowrap}
nav.main>a::after{content:"";position:absolute;left:.5rem;right:.5rem;bottom:.25rem;height:3px;border-radius:2px;background:var(--leaf);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--smooth)}
nav.main>a[aria-current]::after{transform:scaleX(1)}
nav.main>a.cta{background:var(--red);color:#fff;padding:.55rem .95rem;margin-right:.3rem}
nav.main>a.cta::after{display:none}
@media (hover:hover){nav.main>a:hover::after{transform:scaleX(1)}}
.hactions{display:flex;align-items:center;gap:.6rem;margin-left:.6rem}
.cartbtn{position:relative;gap:.55rem}
.cartbtn .n{background:var(--dark);color:#fff;border-radius:999px;min-width:1.7rem;height:1.7rem;display:grid;place-items:center;font-size:.9rem;padding:0 .45rem;font-variant-numeric:tabular-nums}
.cartbtn.has .n{background:var(--red)}
.cartbtn .amt{display:none;font-variant-numeric:tabular-nums}
.cartbtn.has .amt{display:inline}
.cartbtn .amt.tk{animation:tick .3s var(--smooth)}
.cartbtn.bump .n{animation:pop .5s var(--spring)}
@keyframes pop{40%{transform:scale(1.35)}}
.burger{display:none;align-items:center;gap:.5rem;background:var(--leaf);color:#1d2a0a;border:0;border-radius:1rem;min-height:2.8rem;padding:0 1.1rem;font:700 .95rem var(--ui);cursor:pointer}
.burger svg{width:1.4em;height:1.4em}
.hbar.compact nav.main{display:none}
.hbar.compact .burger{display:inline-flex}
.hbar.compact .hactions{margin-left:auto}
@media (max-width:560px){.cartbtn .t{display:none}.hactions{gap:.5rem}.logo img{height:2.2rem!important}.hbar{gap:.5rem}}
@media (max-width:720px){:root{--hh:68px}}

/* mobile menu: its own solid layer above the scrim */
.mnav{position:fixed;inset:0 0 0 auto;width:min(92vw,26rem);background:var(--card);z-index:90;transform:translateX(100%);visibility:hidden;transition:transform .45s var(--smooth),visibility 0s .45s;display:flex;flex-direction:column;overflow:auto;padding:1.2rem 1.2rem 2rem}
.mnav.on{transform:none;visibility:visible;transition:transform .45s var(--smooth),visibility 0s}
.mnav .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.mnav .mh strong{font-size:1.4rem}
.mnav a.l{display:flex;align-items:center;gap:1rem;padding:1rem .9rem;border-radius:1rem;font:700 1.2rem var(--ui);color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line);min-height:3.6rem}
.mnav a.l svg{width:1.7rem;height:1.7rem;color:var(--leaf-ink);flex:none}
.mnav a.l[aria-current]{background:var(--leaf-soft);color:var(--leaf-ink)}
.mnav .btn{margin-top:1rem}
.mlangs{margin-top:1.2rem;justify-content:center}
.mlangs button{color:var(--fg)}
.langs{display:flex;align-items:center;gap:.15rem}
.langs button{font:700 .9rem var(--ui);color:inherit;background:transparent;border:0;border-radius:.4rem;padding:.25rem .55rem;min-height:2rem;cursor:pointer;opacity:.65}
.langs button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-decoration-color:var(--leaf);text-decoration-thickness:3px;text-underline-offset:.35em}
.langs span{opacity:.35}
.iconbtn{width:3.2rem;height:3.2rem;border-radius:50%;border:0;background:var(--mist);color:var(--fg);cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .3s var(--smooth)}
.iconbtn svg{width:1.5rem;height:1.5rem}
.iconbtn:active{transform:scale(.9)}
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
html.lock,html.lock body{overflow:hidden}

/* ===== hero: full-screen photo carousel ===== */
.hero{position:relative;height:calc(100svh - var(--hh));min-height:32rem;max-height:60rem;background:var(--dark);color:#fff;overflow:hidden}
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s .9s}
.slide.on{opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}
.slide>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.07)}
.slide.on>img{animation:kb 9s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
.slide::before{content:"";position:absolute;inset:0;background:rgba(18,18,18,.52);z-index:1}
.sc{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-bottom:5.5rem}
.sc .eyebrow{color:var(--leaf)}
.sc h1,.sc h2{color:#fff;font-size:clamp(2.6rem,6.4vw,5.4rem);max-width:12ch;letter-spacing:-.035em;line-height:1;margin-bottom:.4em}
.sc .lead{color:#F1EEE8;max-width:30ch;font-size:clamp(1.1rem,1.8vw,1.45rem);margin-bottom:2rem}
.hcta{display:flex;gap:.8rem;flex-wrap:wrap}
.hcta .btn{min-height:3.8rem;font-size:1.1rem;padding-inline:1.8rem}
.slide.on .sc>*{animation:slideup 1s var(--bounce) both;animation-delay:calc(var(--k,0)*90ms + 150ms)}
.sc>:nth-child(2){--k:1}.sc>:nth-child(3){--k:2}.sc>:nth-child(4){--k:3}
@keyframes slideup{from{opacity:0;transform:translateY(2.5rem)}to{opacity:1;transform:none}}
.hctl{position:absolute;left:0;right:0;bottom:1.4rem;margin-inline:auto;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.dots{display:flex;gap:.3rem}
.dot{width:3.4rem;height:2.9rem;border:0;background:transparent;padding:0;cursor:pointer;display:grid;align-items:center}
.dot::before{content:"";grid-area:1/1;height:.3rem;border-radius:.3rem;background:rgba(255,255,255,.4)}
.dot i{grid-area:1/1;height:.3rem;border-radius:.3rem;background:#fff;transform:scaleX(0);transform-origin:left}
.dot.on i{transform:scaleX(1)}
.hero.run .dot.on i{animation:fill var(--auto,6.5s) linear both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.arrows{display:flex;gap:.6rem}
.arrows .iconbtn{background:rgba(255,255,255,.2);color:#fff}
@media (hover:hover){.arrows .iconbtn:hover{background:rgba(255,255,255,.35)}}
@media (max-width:700px){.hero{min-height:30rem}.sc h1,.sc h2{font-size:clamp(2.4rem,11vw,3.6rem)}.hcta .btn{flex:1 1 auto;min-height:3.4rem;font-size:1.05rem;padding-inline:1.2rem}.dot{width:2.4rem}}

/* ===== home sections ===== */
.acts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.5rem}
.acttile{display:flex;flex-direction:column;justify-content:space-between;gap:1.2rem;padding:2rem;border-radius:var(--r);min-height:16rem;background:var(--card);border:2px solid var(--line);color:var(--fg);text-decoration:none;transition:transform .45s var(--smooth),border-color .2s}
.acttile svg.big{width:3.6rem;height:3.6rem;color:var(--leaf-ink)}
.acttile strong{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;letter-spacing:-.015em;margin-bottom:.35rem;overflow-wrap:break-word}
.acttile span.d{display:block;font-family:var(--ui);font-size:.95rem;line-height:1.4;opacity:.85}
.acttile .go{display:inline-flex;align-items:center;gap:.4rem;font:800 1rem var(--ui)}
.acttile .go svg{width:1.2rem;height:1.2rem;flex:none}
.acttile.red{background:var(--red);border-color:var(--red);color:#fff}.acttile.red svg.big{color:#fff}
.acttile.dark{background:var(--leaf);border-color:var(--leaf);color:#1d2a0a}.acttile.dark svg.big{color:#1d2a0a}
.acttile:active{transform:scale(.98);transition-duration:.08s}
@media (hover:hover){.acttile:hover{transform:translateY(-5px);border-color:var(--fg)}}
@media (max-width:1000px){.acts4{grid-template-columns:repeat(2,minmax(0,1fr))}.acttile{min-height:12.5rem}}
@media (max-width:520px){.acts4{grid-template-columns:minmax(0,1fr)}.acttile{min-height:auto}}
.shead{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:2.4rem}
.shead h2{margin:0}
.link{display:inline-flex;align-items:center;gap:.4rem;font:800 1.05rem var(--ui);color:var(--leaf-ink)}
.link svg{width:1.2rem;height:1.2rem;flex:none}
.band{border-radius:var(--r);padding:clamp(1.4rem,4vw,2.6rem);display:flex;gap:1.2rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band.dark{background:var(--dark);color:#fff}
.band.red{background:var(--red);color:#fff}
.band.leaf{background:var(--leaf-soft);border:2px solid var(--leaf)}
.band h2,.band h3{margin:0}.band p{margin:.4em 0 0}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5rem}
.steps>div{counter-increment:s;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:2rem}
.steps>div::before{content:counter(s);display:block;font:700 4rem/1 var(--display);color:var(--leaf-ink);margin-bottom:.4rem;letter-spacing:-.04em}
.steps h3{margin-bottom:.4rem}.steps p{font-family:var(--ui);margin:0;color:var(--mut)}
@media (max-width:820px){.steps{grid-template-columns:minmax(0,1fr)}}
.follow{padding:clamp(1.5rem,4vw,2.5rem) 0 0}
.follow .wrap{display:flex;justify-content:center;gap:1rem}
.follow a{width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .4s var(--smooth)}
.follow a svg{width:1.8rem;height:1.8rem}
.follow .wa{background:#25D366}.follow .ig{background:#E1306C}.follow .fb{background:#1877F2}
.follow a:active{transform:scale(.92);transition-duration:.08s}
@media (hover:hover){.follow a:hover{transform:translateY(-4px)}}

/* ===== "Qui som" on the landing: stats + big photo stories ===== */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.5rem;margin-top:2.5rem}
.stat{container-type:inline-size;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:1.8rem 1.6rem}
.stat .num{font-size:clamp(2.2rem,26cqw,4rem);font-weight:700;color:var(--red-ink);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap;overflow-wrap:normal;word-break:keep-all;margin-bottom:.5rem}
.stat p{margin:0;font-family:var(--ui);font-size:.98rem;color:var(--mut)}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.story{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(1.5rem,5vw,4.5rem);align-items:center;margin-top:clamp(3.5rem,8vw,7rem)}
.story.flip .sphoto{order:2}
.sphoto{border-radius:2rem;overflow:hidden;aspect-ratio:4/3.2;background:var(--mist);position:relative}
.sphoto img{width:100%;height:100%;object-fit:cover;display:block}
.stext h3{font-size:clamp(1.8rem,3.4vw,2.8rem);letter-spacing:-.02em;margin-bottom:.9rem}
.stext p{font-family:var(--ui);font-size:1.1rem;line-height:1.65;color:var(--mut);margin-bottom:1.4rem}
@media (max-width:860px){.story{grid-template-columns:minmax(0,1fr)}.story.flip .sphoto{order:0}}
.values{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:3rem}
.values .pill{font-size:.9rem;padding:.5rem 1rem;border-radius:999px;background:var(--leaf);color:#1d2a0a}

/* ===== page head + sub navigation ===== */
.phead{padding:clamp(2rem,5vw,3.5rem) 0 1.6rem;background:var(--bg)}
.crumbs{font:600 .95rem var(--ui);color:var(--mut);margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:.35rem .6rem;align-items:center}
.crumbs a{color:var(--fg);font-weight:700;display:inline-flex;align-items:center;gap:.35rem}
.crumbs a svg{width:1.1rem;height:1.1rem;flex:none}
.phead h1{font-size:clamp(2.1rem,4.6vw,3.5rem);margin-bottom:.5em}
.phead .lead{margin:0;max-width:56ch}
.subnav{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:2rem}
.subnav a{font:700 1rem var(--ui);padding:.65rem 1.1rem;border-radius:.9rem;border:2px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none;min-height:2.9rem;display:inline-flex;align-items:center}
.subnav a[aria-current]{background:var(--leaf);border-color:var(--leaf);color:#1d2a0a}
@media (hover:hover){.subnav a:not([aria-current]):hover{border-color:var(--leaf-ink)}}

/* ===== generic blocks ===== */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(2rem,6vw,5rem);align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5rem}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.5rem}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:2rem;overflow-wrap:break-word}
.list{list-style:none;padding:0;margin:0;display:grid;gap:.8rem;font-family:var(--ui)}
.list li{display:block;position:relative;padding-left:1.5rem}
.list li::before{content:"";position:absolute;left:0;top:.62em;width:.7rem;height:.7rem;border-radius:50% 0 50% 0;background:var(--leaf);transform:rotate(-12deg)}
.pill{font:800 .75rem var(--ui);letter-spacing:.03em;border-radius:.5rem;padding:.25rem .55rem;display:inline-block;background:var(--mist);color:var(--fg)}
.pill.red{background:var(--red);color:#fff}.pill.leaf{background:var(--leaf);color:#1d2a0a}.pill.blue{background:#DCE8FC;color:#0E3E91}.pill.dark{background:var(--dark);color:#fff}
.note{font:.92rem/1.45 var(--ui);background:#FFF1C2;color:#4d3b00;border-radius:.9rem;padding:.8rem 1rem;display:flex;gap:.7rem;align-items:flex-start}
.note svg{width:1.4rem;height:1.4rem;flex:none;margin-top:.1rem}
.empty{text-align:center;padding:2.5rem .5rem;color:var(--mut)}
.empty svg{width:4rem;height:4rem;color:var(--line);margin-bottom:.5rem}
.ring{width:100%;max-width:26rem;aspect-ratio:1;margin-inline:auto}
.ring .dash{transform-origin:50% 50%;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:.7rem;border-radius:999px;background:var(--mist);overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);border-radius:inherit;transition:width .5s var(--smooth)}
.phcard{margin:0;position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:var(--mist)}
.phcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phcard figcaption{position:absolute;left:0;right:0;bottom:0;background:var(--dark);color:#fff;padding:.7rem 1rem;display:flex;align-items:center;gap:.6rem;font:800 1.1rem var(--ui)}
.phcard figcaption svg{width:1.6rem;height:1.6rem;color:var(--leaf);flex:none}
.crate{float:right;width:min(11rem,38%);height:auto;margin:0 0 1rem 1rem;border-radius:1.2rem;border:2px solid var(--line)}

/* long original texts (Empresa, Fresc de mercat, legal…) */
.docs{max-width:1100px}
.docsec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:1.2rem 3rem;padding:2.4rem 0;border-top:1px solid var(--line)}
.docsec h2{font-size:clamp(1.4rem,2.4vw,1.9rem);margin:0;position:sticky;top:calc(var(--hh) + 1.5rem);align-self:start;letter-spacing:-.015em}
.docsec p{max-width:62ch;font-family:var(--ui);line-height:1.7;margin-bottom:1rem}
.docsec.nohead{grid-template-columns:minmax(0,1fr)}
@media (max-width:800px){.docsec{grid-template-columns:minmax(0,1fr)}.docsec h2{position:static}}
.docsec.label{grid-template-columns:minmax(0,1fr);padding-bottom:.4rem;border-top:3px solid var(--leaf)}
.docsec.label h2{position:static}
.legaldoc .docsec{grid-template-columns:minmax(0,1fr);padding:1.2rem 0}
.legaldoc .docsec h2{font-size:1.15rem;position:static}
.legaldoc .docsec p{font-size:.95rem;line-height:1.65}
.morelinks{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem}

/* delivery fee leaflet + order service */
.fee{display:grid;grid-template-columns:minmax(0,20rem) minmax(0,1fr);background:var(--leaf);border-radius:var(--r);overflow:hidden}
.fee .red{background:var(--red);color:#fff;padding:2rem 1.6rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem}
.fee .red h3{color:#fff;margin:0;font-size:clamp(1.4rem,2.4vw,1.9rem)}
.fee .red b.t{font:800 .95rem var(--ui);letter-spacing:.06em;text-transform:uppercase}
.fee .coin{width:7.5rem;height:7.5rem;border-radius:50%;background:#fff;color:var(--red-ink);display:grid;place-items:center;font:700 3rem/1 var(--display);letter-spacing:-.03em;white-space:nowrap}
.fee .notes{padding:2rem;color:#1d2a0a;font:.92rem/1.55 var(--ui);display:grid;gap:.9rem;align-content:center}
.fee .notes strong{font:700 clamp(1.4rem,2.6vw,2rem)/1.1 var(--display);display:block}
.fee .notes small{font-size:.85rem;display:block}
@media (max-width:760px){.fee{grid-template-columns:minmax(0,1fr)}}
.sbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:2rem;align-items:center;background:var(--dark);color:#fff;border-radius:var(--r);padding:clamp(1.6rem,4vw,2.6rem)}
.sbox h3{color:#fff;font-size:clamp(1.5rem,2.6vw,2rem)}
.sbox p{color:#D9D6D0;font-family:var(--ui)}
.sbox .big{font:700 clamp(1.8rem,4vw,2.8rem)/1.1 var(--display);color:#fff;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;letter-spacing:-.02em;text-decoration:none}
.sbox .big svg{width:1.1em;height:1.1em;color:var(--leaf);flex:none}
.sbox a{color:#fff}
.sbox ul{list-style:none;padding:0;margin:0;display:grid;gap:.5rem;font-family:var(--ui);font-size:.95rem}
.sbox ul li{display:flex;gap:.6rem;align-items:flex-start}.sbox ul svg{width:1.3rem;height:1.3rem;color:var(--leaf);flex:none;margin-top:.15rem}
@media (max-width:860px){.sbox{grid-template-columns:minmax(0,1fr)}}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.8rem 1.5rem}
.svcs li{display:flex!important;align-items:center;gap:.7rem;padding-left:0!important;font-family:var(--ui);font-weight:600}
.svcs li::before{display:none}
.svcs svg{width:1.6rem;height:1.6rem;color:var(--leaf-ink);flex:none}

/* ===== products ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));gap:1.5rem}
.prod{display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);border-radius:1.3rem;overflow:hidden}
.pimg{position:relative;aspect-ratio:16/10;background:color-mix(in srgb,var(--cc,#262626) 10%,var(--card));color:var(--cc,#262626);display:grid;place-items:center;overflow:hidden}
.pimg svg{width:34%;height:auto;aspect-ratio:1}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(var(--z,1));transform-origin:var(--ox,50%) var(--oy,50%)}
.pimg .tags{position:absolute;top:.6rem;left:.6rem;display:flex;gap:.3rem;flex-wrap:wrap;z-index:1}
.pbody{padding:1.25rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.prod h4{margin:0;min-height:2.5em}
.prod .sz{font:.88rem var(--ui);color:var(--mut);min-height:1.3em}
.price{font:800 1.5rem/1.1 var(--ui);font-variant-numeric:tabular-nums;margin-top:.2rem}
.price small{font-size:.85rem;font-weight:600;color:var(--mut)}
.price s{font-size:.95rem;font-weight:500;color:var(--mut);margin-left:.4rem}
.price.off{color:var(--red-ink)}
.act{margin-top:auto;padding-top:.7rem}
.addbtn{width:100%;min-height:3.2rem;border-radius:.95rem;border:0;background:var(--red);color:#fff;font:800 1.05rem var(--ui);display:flex;align-items:center;justify-content:center;gap:.5rem;cursor:pointer;touch-action:manipulation;transition:transform .3s var(--smooth)}
.addbtn svg{width:1.3em;height:1.3em;flex:none}
.addbtn:active{transform:scale(.96);transition-duration:.08s}
.stepper{display:grid;grid-template-columns:3.2rem minmax(0,1fr) 3.2rem;align-items:center;background:var(--mist);border-radius:.95rem;min-height:3.2rem;overflow:hidden;font:800 1.05rem var(--ui)}
.stepper.in{animation:stepin .5s var(--spring)}
@keyframes stepin{from{transform:scale(.85);opacity:.4}}
.stepper button{height:3.2rem;border:0;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.stepper button svg{width:1.3rem;height:1.3rem}
.stepper button:active{filter:brightness(.9)}
.stepper span{text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.stepper span.tk{animation:tick .3s var(--smooth)}
@keyframes tick{from{transform:translateY(40%);opacity:0}}
@media (hover:hover){.addbtn:hover{filter:brightness(.95)}}
img.f{opacity:0;transition:opacity .25s ease-out}
img.f.ld{opacity:1}

/* ===== shop ===== */
.shop{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:2.5rem;align-items:start}
.sidewrap{display:block}
.side{position:sticky;top:calc(var(--hh) + 1rem);display:grid;gap:.3rem;font-family:var(--ui)}
.side h4{font:800 .8rem var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 .4rem .4rem}
.side button{display:flex;align-items:center;gap:.7rem;text-align:left;border:0;background:transparent;color:var(--fg);padding:.55rem .7rem;border-radius:.9rem;cursor:pointer;font:700 1rem var(--ui);min-height:2.9rem}
.side button svg{width:1.7rem;height:1.7rem;color:var(--leaf-ink);flex:none}
.side button[aria-pressed="true"]{background:var(--leaf);color:#1d2a0a}
.side button[aria-pressed="true"] svg{color:#1d2a0a}

.sidetoggle{display:none;justify-content:space-between}
.sidetoggle span{flex:1;text-align:left}
.toolbar{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1.6rem;align-items:center;font-family:var(--ui)}
.searchbox{position:relative;flex:1;min-width:14rem}
.searchbox svg{position:absolute;left:1rem;top:50%;transform:translateY(-50%);width:1.4rem;height:1.4rem;color:var(--mut);pointer-events:none}
.searchbox input{padding-left:3rem}
input,select,textarea{font:inherit;font-family:var(--ui);color:var(--fg);background:var(--card);border:2px solid #BDB5A2;border-radius:.9rem;padding:.8rem 1rem;width:100%;min-height:3.3rem;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--dark);outline:3px solid var(--blue);outline-offset:2px}
.toolbar select{width:auto}
.tagrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.6rem}
.tagrow button{font:700 .95rem var(--ui);border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:.8rem;padding:.5rem .95rem;cursor:pointer;min-height:2.7rem}
.tagrow button[aria-pressed="true"]{background:var(--leaf);color:#1d2a0a;border-color:var(--leaf)}
@media (max-width:900px){
  .shop{grid-template-columns:minmax(0,1fr);gap:1rem}
  .sidetoggle{display:flex}
  .sidewrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--smooth)}
  .sidewrap.open{grid-template-rows:1fr}
  .sidewrap .side{display:grid;overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .3s;position:static;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}
  .sidewrap.open .side{visibility:visible;transition:visibility 0s}
  .side h4{grid-column:1/-1}
  .side button{border:2px solid var(--line);background:var(--card)}
  .side button[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf)}
  .sidetoggle svg:last-child{transition:transform .3s var(--smooth)}
  .sidetoggle[aria-expanded="true"] svg:last-child{transform:rotate(180deg)}
  .pimg{aspect-ratio:2/1}
}

/* ===== cart drawer, confirmation bar, toast ===== */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(30rem,100%);background:var(--card);z-index:100;transform:translateX(100%);visibility:hidden;transition:transform .5s var(--smooth),visibility 0s .5s;display:flex;flex-direction:column;touch-action:pan-y}
.drawer.on{transform:none;visibility:visible;transition:transform .5s var(--smooth),visibility 0s}
.drawer.drag{transition:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0}
.dbody{flex:1;overflow:auto;padding:.5rem 1.2rem}
.dfoot{padding:1rem 1.2rem 1.2rem;border-top:1px solid var(--line);display:grid;gap:.8rem}
.line{display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:.8rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line);overflow:hidden;transition:max-height .22s ease-out,opacity .22s ease-out,padding .22s ease-out,border-color .22s}
.line.out{max-height:0!important;opacity:0;padding-block:0;border-bottom-color:transparent}
.line .th{position:relative;overflow:hidden;width:3.6rem;height:3.6rem;border-radius:1rem;display:grid;place-items:center;background:var(--mist);color:var(--dark)}
.line .th svg{width:60%;height:60%}
.line .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(var(--z,1));transform-origin:var(--ox,50%) var(--oy,50%)}
.line .nm{font-weight:700;line-height:1.25}
.line .meta{font:.88rem var(--ui);color:var(--mut)}
.line .stepper{grid-column:1/-1;max-width:14rem}
.line textarea{grid-column:1/-1;font-size:.9rem;border-style:dashed;min-height:2.8rem;padding:.5rem .8rem;resize:vertical}
.free{font-family:var(--ui);margin-bottom:.4rem}
.free .ok{display:flex;align-items:center;gap:.5rem}
.free .ok svg{width:1.5rem;height:1.5rem;color:var(--leaf-ink);flex:none}
.free.pop .ok svg{animation:pop2 .55s var(--spring)}
.packnote{font:.85rem/1.4 var(--ui);color:var(--mut);margin:0;background:var(--mist);border-radius:.8rem;padding:.6rem .8rem}
.sum{display:grid;gap:.4rem;font-family:var(--ui);font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:1rem}
.sum .tot{font-size:1.4rem;font-weight:800;padding-top:.6rem;border-top:2px solid var(--fg)}
.cartbar{border:2px solid #555;position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 2rem));width:auto;max-width:calc(100% - 1.5rem);background:var(--dark);color:#fff;border-radius:1.1rem;padding:.45rem .45rem .45rem 1.1rem;display:flex;align-items:center;gap:.9rem;z-index:70;visibility:hidden;white-space:nowrap;transition:transform .55s var(--smooth),visibility 0s .55s;box-shadow:0 20px 40px -16px rgba(0,0,0,.6)}
.cartbar.on{transform:translate(-50%,0);visibility:visible;transition:transform .55s var(--smooth),visibility 0s}
.cartbar .info{flex:0 0 auto;display:flex;align-items:baseline;gap:.6rem;font-family:var(--ui);line-height:1.2}
.cartbar .info b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.cartbar .info span{font-size:.9rem;opacity:.85}
.cartbar .info .tk{animation:tick .3s var(--smooth)}
.cartbar .btn{min-height:2.7rem;padding:.4rem 1.1rem;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(var(--hh) + 1rem);transform:translate(-50%,-150%);background:var(--fg);color:#fff;font:700 1rem var(--ui);border-radius:1rem;padding:.9rem 1.4rem;z-index:110;transition:transform .5s var(--spring),visibility 0s .5s;max-width:calc(100% - 2rem);visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .5s var(--spring)}

/* ===== checkout + forms ===== */
.stepbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.2rem;font-family:var(--ui);font-weight:700}
.stepbar span{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .9rem .4rem .4rem;border-radius:999px;background:var(--card);border:2px solid var(--line);color:var(--mut)}
.stepbar span i{font-style:normal;width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:var(--mist)}
.stepbar span.on{background:var(--leaf);border-color:var(--leaf);color:#1d2a0a}.stepbar span.on i{background:var(--red);color:#fff}
.stepbar span.done i{background:var(--leaf);color:#1d2a0a}
.co{display:grid;grid-template-columns:minmax(0,1fr) 24rem;gap:1.6rem;align-items:start}
.co aside{position:sticky;top:calc(var(--hh) + 1rem)}
@media (max-width:980px){.co{grid-template-columns:minmax(0,1fr)}.co aside{position:static}}
.form{display:grid;gap:1rem}
.form label{display:grid;gap:.4rem;font:700 1rem var(--ui)}
.form .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
@media (max-width:560px){.form .two{grid-template-columns:minmax(0,1fr)}}
.form .err{border-color:var(--red)!important}
.form small.e{color:var(--red-ink);font-weight:700;display:none}
.form .err+small.e{display:block;animation:fadein .16s ease-out}
#sloterr{animation:fadein .16s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}}
.opt{display:flex!important;gap:.9rem;align-items:center;border:2px solid var(--line);border-radius:1.1rem;padding:1rem 1.1rem;cursor:pointer;font-family:var(--ui);background:var(--card);transition:border-color .2s,background .2s;font-weight:400!important}
.opt input{width:1.5rem;min-height:1.5rem;height:1.5rem;padding:0;margin:0;flex:none;accent-color:var(--red)}
.opt:has(input:checked){border-color:var(--leaf-ink);background:var(--leaf-soft)}
.opt b{display:block;font-size:1.05rem}.opt span{font-size:.92rem;color:var(--mut)}
.days{display:flex;gap:.5rem;flex-wrap:wrap}
.day{min-width:5.6rem;text-align:center;border:2px solid var(--line);border-radius:1rem;padding:.6rem;background:var(--card);color:var(--fg);cursor:pointer;font:800 1rem var(--ui);min-height:3.6rem}
.day small{display:block;font-weight:600;color:var(--mut)}
.day[aria-pressed="true"],.slot[aria-pressed="true"]{background:var(--leaf);color:#1d2a0a;border-color:var(--leaf)}
.day[aria-pressed="true"] small{color:#1d2a0a}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin-top:.8rem}
.slot{border:2px solid var(--line);border-radius:1rem;padding:.7rem;background:var(--card);color:var(--fg);font:800 1rem var(--ui);cursor:pointer;min-height:3.3rem}
.slot[disabled]{opacity:.45;text-decoration:line-through;cursor:not-allowed}
@media (max-width:560px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stripebox{border:2px dashed var(--line);border-radius:1.1rem;padding:1rem;font:.92rem var(--ui);color:var(--mut);display:grid;gap:.5rem}
.stripebox i{display:block;height:2.4rem;border-radius:.7rem;background:var(--mist)}
.check{width:6rem;height:6rem;border-radius:50%;background:var(--leaf);display:grid;place-items:center;margin-bottom:1.2rem;animation:pop2 .8s var(--spring)}
.check svg{width:3.2rem;height:3.2rem;stroke:#fff;stroke-width:5;fill:none;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .3s forwards}
@keyframes pop2{from{transform:scale(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
.store{display:flex;flex-direction:column;gap:.6rem}
.store h3{margin:0}.store .addr{font-family:var(--ui);color:var(--mut)}
.store .tel{font:800 1.2rem var(--ui);color:var(--fg);display:inline-flex;align-items:center;gap:.5rem;text-decoration:none}
.store .tel svg{width:1.3rem;height:1.3rem;color:var(--leaf-ink);flex:none}
.store .acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:auto;padding-top:.5rem}
.match{display:flex;justify-content:space-between;gap:.8rem;padding:.6rem 0;border-bottom:1px solid var(--line);font:.95rem var(--ui)}

/* ===== modal ===== */
.modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:1rem;pointer-events:none;visibility:hidden;background:rgba(20,20,20,0);transition:background .3s,visibility 0s .3s}
.modal.on{pointer-events:auto;visibility:visible;background:rgba(20,20,20,.6);transition:background .3s,visibility 0s}
.modal .box{background:var(--card);border-radius:1.6rem;padding:1.6rem;width:min(40rem,100%);max-height:90vh;overflow:auto;transform:translateY(24px) scale(.97);opacity:0;transition:transform .5s var(--spring),opacity .25s}
.modal.on .box{transform:none;opacity:1}
.modal textarea{min-height:9rem}

/* ===== footer: phone, languages, contact and social networks live here ===== */
footer.site{background:var(--dark);color:#D4D1CB;margin-top:clamp(3rem,7vw,6rem);padding:4rem 0 3rem;font-family:var(--ui)}
footer.site a{color:#fff;text-decoration:none;display:inline-block;padding:.2rem 0}
footer.site a:hover{text-decoration:underline}
footer.site h4{color:var(--leaf);font:800 .8rem var(--ui);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.8rem}
footer.site .cols{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:2.5rem}
footer.site ul{list-style:none;padding:0;margin:0;display:grid;gap:.3rem}
footer.site p{max-width:none}
footer.site .fsoc{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
footer.site .fsoc a{display:inline-flex;align-items:center;gap:.55rem;padding:.5rem 1rem .5rem .6rem;border-radius:999px;background:#fff;color:var(--dark);font-weight:700}
footer.site .fsoc a:hover{text-decoration:none;background:var(--leaf-soft)}
footer.site .fsoc svg{width:1.5rem;height:1.5rem;flex:none}
footer.site .fsoc .wa svg{color:#25D366}footer.site .fsoc .ig svg{color:#E1306C}footer.site .fsoc .fb svg{color:#1877F2}
footer.site .ftel{display:flex;align-items:center;gap:.6rem;font:700 clamp(1.5rem,2.4vw,2rem)/1.1 var(--display);margin-bottom:1rem;letter-spacing:-.01em}
footer.site .ftel svg{width:1.3em;height:1.3em;color:var(--leaf);flex:none}
footer.site .base{border-top:1px solid #4a4a4a;margin-top:2.5rem;padding-top:1.4rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem 2rem;font-size:.9rem}
footer.site .flang{color:#fff}
footer.site .flang .lb{opacity:.7;margin-right:.4rem}
footer.site .flang button{color:#fff;font-size:1rem}
@media (max-width:980px){footer.site .cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){footer.site .cols{grid-template-columns:minmax(0,1fr)}}

/* ===== site map page ===== */
.smap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem}
.smap .card h3{display:flex;align-items:center;gap:.7rem}.smap .card h3 svg{width:2rem;height:2rem;color:var(--leaf-ink);flex:none}
.smap ul{list-style:none;padding:0;margin:0;display:grid;gap:.2rem}
.smap li a{display:block;padding:.7rem .2rem;border-bottom:1px solid var(--line);font:700 1.05rem var(--ui);color:var(--fg);text-decoration:none}
.smap li a small{display:block;font-weight:400;color:var(--mut);font-size:.9rem}
@media (max-width:760px){.smap{grid-template-columns:minmax(0,1fr)}}

/* ===== entrances: things jump up from below and settle with one organic rebound (Apple-style) ===== */
.rv{opacity:0;transform:translateY(5rem) scale(.94)}
.rv.in{opacity:1;transform:none;animation:jump 1s var(--bounce) both;animation-delay:var(--d,0ms)}
.rv.in.now{animation:none}
@keyframes jump{from{opacity:0;transform:translateY(5rem) scale(.94)}to{opacity:1;transform:none}}
::view-transition-old(root){animation:vt-out .18s ease both}
::view-transition-new(root){animation:vt-in .3s var(--smooth) both}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(8px)}}

/* ===== accessibility signals ===== */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .rv{opacity:1;transform:none}
  .hero3d{height:auto}.hero3d .sticky{position:relative;top:0;height:auto;padding-block:2rem}
}
@media (prefers-contrast:more){:root{--line:#6d6a63;--mut:#33312d}.card,.prod{border-color:var(--fg)}}

/* narrow phones: the header must always fit (logo + cart + menu) */
@media (max-width:480px){.cartbtn .amt{display:none!important}.logo img{height:2rem!important}.cartbtn{padding-inline:.9rem}}
@media (max-width:360px){.burger span{display:none}.burger{padding:0 .9rem}.logo img{height:1.8rem!important}.hbar{gap:.4rem}}
@media (max-width:700px){.arrows{gap:.4rem}.arrows .iconbtn{width:2.8rem;height:2.8rem}.dot{width:2rem}.dots{gap:.2rem}}

/* logo de la demo: text fosc, i blanc al peu (fons fosc) */
.lt{fill:#262626}
footer.site .lt{fill:#fff}
/* peu: el telèfon no es parteix, el botó té el text centrat (la regla general dels enllaços del peu li treia el farciment) */
footer.site .ftel{white-space:nowrap;font-size:clamp(1.3rem,5.6vw,2rem)}
@media (min-width:900px){footer.site .ftel{font-size:clamp(1.5rem,2.4vw,2rem)}}
footer.site a.btn{display:inline-flex;align-items:center;justify-content:center;padding:.5rem 1.2rem;text-align:center;min-height:2.8rem}

</style>

/* ---------- CORE ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
let lang='ca';
try{const s=localStorage.getItem('jp-lang');lang=s||'ca'}catch(e){}
const L=(ca,es)=>lang==='es'?es:ca;
const eur=n=>n.toLocaleString(lang==='es'?'es-ES':'ca-ES',{style:'currency',currency:'EUR'});
const num=n=>n.toLocaleString(lang==='es'?'es-ES':'ca-ES',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pname=p=>lang==='es'?p.es:p.ca;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let cart=store.get('jp-cart',{});
let shop={cat:'all',q:'',tag:'',sort:'rel',limit:24};
let co={mode:'delivery',store:3,day:0,slot:-1,pay:'card',sub:'sub',f:{}};
let lastOrder=null;
const pById=id=>PRODUCTS.find(p=>p.id===id);
const unitPrice=p=>p.o??p.p;
const saveCart=()=>store.set('jp-cart',cart);
const lines=()=>Object.entries(cart).map(([id,l])=>({p:pById(id),...l})).filter(l=>l.p);
const subtotal=()=>lines().reduce((s,l)=>s+unitPrice(l.p)*l.q,0);
const cnt=()=>lines().length;
const heavyCount=()=>lines().filter(l=>HEAVY.has(l.p.id)).reduce((n,l)=>n+l.q,0);
const packFee=()=>{const n=heavyCount();return co.mode==='pickup'||n<=PACK_BAND?0:PACK_FEE*(Math.ceil(n/PACK_BAND)-1)};
const baseFee=()=>{const s=subtotal();return co.mode==='pickup'||s===0||s>=FREE_FROM?0:FEE};
const fee=()=>baseFee()+packFee();
const fmtQ=p=>q=>p.u==='kg'?num(q)+' kg':String(q);

function tagPills(p){return p.tags.map(t=>{const d=TAGS[t];return `<span class="pill ${d[2]}">${lang==='es'?d[1]:d[0]}</span>`}).join('')+(p.o?`<span class="pill red">${L('Oferta','Oferta')}</span>`:'')}

/* ---------- PRODUCT CARD: the add button becomes the stepper in place ---------- */
function actHTML(p){
  const q=cart[p.id]?.q||0;
  return q?`<div class="stepper"><button data-act="dec" data-id="${p.id}" aria-label="${L('Treu','Quita')} ${esc(pname(p))}">${svg('minus')}</button><span aria-live="polite">${fmtQ(p)(q)}</span><button data-act="inc" data-id="${p.id}" aria-label="${L('Afegeix','Añade')} ${esc(pname(p))}">${svg('plus')}</button></div>`
    :`<button class="addbtn" data-act="inc" data-id="${p.id}" aria-label="${L('Afegeix a la cistella','Añadir a la cesta')}: ${esc(pname(p))}">${svg('plus')}${L('Afegir','Añadir')}</button>`;
}
/* every product has its own photo (img/p/<id>.jpg); if it is missing the section icon stays visible */
const ph=p=>`<img class="f" src="img/p/${p.id}.jpg" alt="" loading="lazy" decoding="async" onerror="this.remove()">`;
function prodCard(p){
  const c=CAT[p.c],unit=p.u==='kg'?'/kg':'';
  return `<article class="prod" data-card="${p.id}" style="--cc:${c.col}">
  <div class="pimg">${svg(p.c)}${ph(p)}<div class="tags">${tagPills(p)}</div></div>
  <div class="pbody"><h4>${esc(pname(p))}</h4>
  <div class="sz">${esc(p.size||(p.u==='kg'?L('Preu per quilo','Precio por kilo'):''))||'&nbsp;'}</div>
  <div class="price ${p.o?'off':''}">${eur(unitPrice(p))}<small>${unit}</small>${p.o?`<s>${eur(p.p)}</s>`:''}</div>
  <div class="act" data-actfor="${p.id}">${actHTML(p)}</div></div></article>`}

/* ---------- CART ops ---------- */
function change(id,dir){
  const p=pById(id);if(!p)return;
  const cur=cart[id]?.q||0;
  if(cur===0&&dir<0)return; /* e.g. a fast double click on a line that is already collapsing */
  const q=Math.round((cur+dir*p.step)*100)/100;
  if(q<=0){delete cart[id]}else{cart[id]={q,note:cart[id]?.note||''}}
  saveCart();syncCards(id,cur===0&&q>0);refreshCart(dir>0);pingBar();
}
function syncCards(id,fresh){
  const p=pById(id),q=cart[id]?.q||0;
  $$(`[data-actfor="${id}"]`).forEach(box=>{
    const sp=$('.stepper span',box);
    if(sp&&q){sp.textContent=fmtQ(p)(q);sp.classList.remove('tk');void sp.offsetWidth;sp.classList.add('tk');return}
    const had=box.contains(document.activeElement);
    box.innerHTML=actHTML(p);
    if(fresh&&!reduce)$('.stepper',box)?.classList.add('in');
    if(had)(q?$('[data-act="inc"]',box):$('.addbtn',box))?.focus({preventScroll:true});
  });
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3000)}

let wasFree=subtotal()>=FREE_FROM,booted=false;
const lineHTML=l=>{const c=CAT[l.p.c];return `<div class="line" data-id="${l.p.id}" style="--cc:${c.col}">
    <div class="th">${svg(l.p.c)}${ph(l.p)}</div>
    <div><div class="nm">${esc(pname(l.p))}</div><div class="meta">${eur(unitPrice(l.p))}${l.p.u==='kg'?'/kg':''} · <strong>${eur(unitPrice(l.p)*l.q)}</strong></div></div>
    <div class="stepper"><button data-act="dec" data-id="${l.p.id}" aria-label="${L('Treu','Quita')}">${svg('minus')}</button><span>${fmtQ(l.p)(l.q)}</span><button data-act="inc" data-id="${l.p.id}" aria-label="${L('Afegeix','Añade')}">${svg('plus')}</button></div>
    ${FRESH.has(l.p.c)?`<textarea data-note="${l.p.id}" placeholder="${L("Tall, gruix o comentari per a l'especialista",'Corte, grosor o comentario para el especialista')}" rows="1" aria-label="${L('Nota per a','Nota para')} ${esc(pname(l.p))}">${esc(l.note)}</textarea>`:''}
  </div>`};
function rebuildBody(){
  const body=$('#drawerbody');body.dataset.lang=lang;
  body.innerHTML=cnt()?lines().map(lineHTML).join(''):`<div class="empty">${svg('cart')}<p style="margin-inline:auto">${L('La cistella és buida. Comença a afegir productes.','La cesta está vacía. Empieza a añadir productos.')}</p><a class="btn" href="#botiga" data-close>${L('Anar a la botiga','Ir a la tienda')}</a></div>`;
}
function refreshCart(added){
  const n=cnt(),st=subtotal(),r=currentRoute();
  const cb=$('#cartbtn');
  if(cb){$('#cartn').textContent=n;cb.classList.toggle('has',n>0);
    const am=$('#cartamt');am.textContent=n?eur(st):'';if(added&&!reduce){cb.classList.remove('bump');void cb.offsetWidth;cb.classList.add('bump');am.classList.remove('tk');void am.offsetWidth;am.classList.add('tk')}}
  /* drawer: lines are updated in place (so a removed line can collapse and the progress bar can travel) */
  $('#drawer header').innerHTML=`<h3>${L('La teva cistella','Tu cesta')}</h3><button class="iconbtn" data-act="cart-close" aria-label="${L('Tancar la cistella','Cerrar la cesta')}">${svg('close')}</button>`;
  const body=$('#drawerbody'),ids=lines().map(l=>l.p.id),dom=$$('.line',body).map(e=>e.dataset.id);
  if(body.dataset.lang===lang&&dom.length&&!$('.line.out',body)&&ids.every(i=>dom.includes(i))){
    lines().forEach(l=>{const el=$(`.line[data-id="${l.p.id}"]`,body);if(!el)return;$('.stepper span',el).textContent=fmtQ(l.p)(l.q);$('.meta strong',el).textContent=eur(unitPrice(l.p)*l.q)});
    dom.filter(i=>!ids.includes(i)).forEach(i=>{const el=$(`.line[data-id="${i}"]`,body);if(!el)return;
      if(reduce){el.remove();return}
      el.style.maxHeight=el.offsetHeight+'px';void el.offsetWidth;el.classList.add('out');setTimeout(()=>el.remove(),240)});
    if(!n)setTimeout(()=>{if(!cnt())rebuildBody()},reduce?0:260);
  }else rebuildBody();
  const foot=$('#drawerfoot'),left=Math.max(0,FREE_FROM-st),free=st>=FREE_FROM;
  if(!n){foot.innerHTML='';delete foot.dataset.k}
  else{
    if(foot.dataset.k!==lang){
      foot.innerHTML=`<div><div class="free" id="freemsg"></div><div class="progress"><i id="freebar"></i></div></div><p class="packnote" id="packnote" hidden></p><div class="sum"><div class="tot"><span>${L('Subtotal','Subtotal')}</span><span id="subt"></span></div></div><a class="btn block" href="#comanda" data-close>${L('Finalitzar la comanda','Finalizar el pedido')}${svg('arrow')}</a>`;
      foot.dataset.k=lang;$('#freebar').style.width='0%';void $('#freebar').offsetWidth}
    const msg=$('#freemsg');
    msg.innerHTML=free?`<span class="ok">${svg('check')}<b>${L('Repartiment gratuït desbloquejat','Reparto gratuito desbloqueado')}</b></span>`:`<span>${L(`Et falten <b>${eur(left)}</b> per al repartiment gratuït`,`Te faltan <b>${eur(left)}</b> para el reparto gratuito`)}</span>`;
    if(free&&!wasFree&&!reduce){msg.classList.remove('pop');void msg.offsetWidth;msg.classList.add('pop')}
    $('#freebar').style.width=Math.min(100,st/FREE_FROM*100)+'%';
    $('#subt').textContent=eur(st);
    const pn=$('#packnote'),hc=heavyCount();pn.hidden=hc<=PACK_BAND;
    if(!pn.hidden)pn.textContent=L(`Tens ${hc} packs d'aigua, llet o garrafes: cada franja de ${PACK_BAND} packs addicionals afegeix ${PACK_FEE} € al repartiment.`,`Tienes ${hc} packs de agua, leche o garrafas: cada franja de ${PACK_BAND} packs adicionales añade ${PACK_FEE} € al reparto.`);
  }
  wasFree=free;
  /* confirmation bar: content only here; it is shown briefly by pingBar() after the user changes the cart */
  const bar=$('#cartbar');
  bar.setAttribute('aria-label',L('Resum de la cistella','Resumen de la cesta'));
  bar.innerHTML=`<div class="info"><b>${eur(st)}</b><span>${n} ${n===1?L('producte','producto'):L('productes','productos')}</span></div><button class="btn sm" data-act="cart">${svg('cart')}${L('Veure','Ver')}</button>`;
  if(added&&!reduce)$('.info b',bar).classList.add('tk');
  if(!n)hideBar();
  if(r==='comanda')paintSummary();
  fitNav();
}
/* the bar is a short confirmation (≈3 s), not permanent chrome: the header button already carries count and total */
let barTimer=0,barHot=false;
function hideBar(){clearTimeout(barTimer);const b=$('#cartbar');b.classList.remove('on');b.setAttribute('aria-hidden','true')}
function pingBar(){
  const r=currentRoute();
  if(!cnt()||ov.cart||ov.nav||r==='comanda'||r==='gracies')return hideBar();
  const b=$('#cartbar');b.classList.add('on');b.setAttribute('aria-hidden','false');
  clearTimeout(barTimer);barTimer=setTimeout(()=>{barHot?pingBar():hideBar()},3200);
}
(()=>{const b=document.getElementById('cartbar');if(!b)return;
  b.addEventListener('pointerenter',()=>barHot=true);b.addEventListener('pointerleave',()=>barHot=false);
  b.addEventListener('focusin',()=>barHot=true);b.addEventListener('focusout',()=>barHot=false)})();

/* overlays (one place decides scrim + scroll lock) */
const ov={cart:false,nav:false};
function syncOverlay(){$('#scrim').classList.toggle('on',ov.cart||ov.nav);document.documentElement.classList.toggle('lock',ov.cart||ov.nav||!!document.querySelector('.modal.on'));refreshBar()}
function refreshBar(){if(ov.cart||ov.nav)hideBar()}
function openCart(on=true){ov.cart=on;$('#drawer').classList.toggle('on',on);$('#drawer').setAttribute('aria-hidden',!on);syncOverlay();if(on)$('#drawer .iconbtn')?.focus({preventScroll:true})}
function setNav(on){ov.nav=on;$('#mnav').classList.toggle('on',on);$('#mnav').setAttribute('aria-hidden',!on);$('#burger')?.setAttribute('aria-expanded',on);syncOverlay();if(on)$('#mnav .iconbtn')?.focus({preventScroll:true})}

/* the menu is a hamburger ONLY when the written menu does not fit in the header */

const ROUTES={};
function currentRoute(){const h=(location.hash||'').replace('#','');return ROUTES[h]?h:'inici'}
function render(first){
  const r=currentRoute();
  const go=()=>{
    hideBar();
    $('#view').innerHTML=ROUTES[r]();
    paintHeader();
    document.title='HortAlPlat'+(r==='inici'?'':' · '+(TITLES[r]?TITLES[r]():r));
    if(!first)scrollTo({top:0,behavior:'instant'});
    afterRender(!first||!booted);refreshCart();
  };
  if(!first&&!reduce&&document.startViewTransition)document.startViewTransition(go);else go();
}
const TITLES={};
function afterRender(animate){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.done){e.target.dataset.done=1;countUp(e.target)}}),{threshold:.6});
  $$('[data-count]').forEach(el=>io.observe(el));
  if(currentRoute()==='botiga')paintShop(true);
  if(currentRoute()==='comanda'){paintSummary();paintSlots()}
  initHero();autoReveal(animate);
}
function countUp(el){
  if(reduce)return;const end=+el.dataset.count,suf=el.dataset.suf||'';const t0=performance.now(),dur=1300;
  (function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(end*e)+suf;if(k<1)requestAnimationFrame(f)})(t0);
}
addEventListener('hashchange',()=>{openCart(false);setNav(false);render()});

/* ---------- HERO: full-screen photo carousel (autoplay, pause, swipe, keyboard; no autoplay with reduced motion) ---------- */
let heroStop=null;
const HERO_MS=6500;
function initHero(){
  if(heroStop){heroStop();heroStop=null}
  const h=$('#hero');if(!h)return;
  const slides=$$('.slide',h),dots=$$('.dot',h),n=slides.length,playBtn=$('#hplay');
  let i=0,timer=0,paused=reduce,hot=false,x0=null,alive=true;
  h.style.setProperty('--auto',HERO_MS+'ms');
  const setPlayIcon=()=>{playBtn.innerHTML=svg(paused?'play':'pause');playBtn.setAttribute('aria-label',paused?L('Reprèn el carrusel','Reanuda el carrusel'):L('Atura el carrusel','Detén el carrusel'))};
  const arm=()=>{clearTimeout(timer);h.classList.remove('run');void h.offsetWidth;if(!alive||paused||hot||document.hidden)return;h.classList.add('run');timer=setTimeout(()=>show(i+1),HERO_MS)};
  function show(k){
    i=(k+n)%n;
    slides.forEach((s,j)=>{const on=j===i;s.classList.toggle('on',on);s.setAttribute('aria-hidden',!on);s.inert=!on});
    dots.forEach((d,j)=>{d.classList.toggle('on',j===i);if(j===i)d.setAttribute('aria-current','true');else d.removeAttribute('aria-current')});
    h.setAttribute('aria-live',paused?'polite':'off');arm();
  }
  window.__heroGo=d=>show(i+d);window.__heroTo=k=>show(k);
  window.__heroToggle=()=>{paused=!paused;setPlayIcon();arm()};
  const enter=()=>{hot=true;arm()},leave=()=>{hot=false;arm()};
  const down=e=>{x0=e.clientX},up=e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>50)show(i+(dx<0?1:-1))};
  const key=e=>{if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1)};
  const vis=()=>arm();
  h.addEventListener('pointerenter',enter);h.addEventListener('pointerleave',leave);h.addEventListener('focusin',enter);h.addEventListener('focusout',leave);
  h.addEventListener('pointerdown',down);h.addEventListener('pointerup',up);h.addEventListener('keydown',key);document.addEventListener('visibilitychange',vis);
  setPlayIcon();arm();
  heroStop=()=>{alive=false;clearTimeout(timer);h.removeEventListener('pointerenter',enter);h.removeEventListener('pointerleave',leave);h.removeEventListener('focusin',enter);h.removeEventListener('focusout',leave);h.removeEventListener('pointerdown',down);h.removeEventListener('pointerup',up);h.removeEventListener('keydown',key);document.removeEventListener('visibilitychange',vis);window.__heroGo=window.__heroTo=window.__heroToggle=null};
}

  const a=e.target.closest('[data-act]');
  if(e.target.closest('[data-close]'))openCart(false);
  if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  if(act==='inc')change(id,1);
  else if(act==='dec')change(id,-1);
  else if(act==='cart')openCart(true);
  else if(act==='cart-close')openCart(false);
  else if(act==='lang'){lang=a.dataset.l;try{localStorage.setItem('jp-lang',lang)}catch(_){ }document.documentElement.lang=lang;paintFooter();render(true)}
  else if(act==='burger')setNav(!ov.nav);
  else if(act==='more'){shop.limit+=24;paintShop(false)}
  else if(act==='cat'){shop.limit=24;shop.cat=a.dataset.v;$('#sidewrap')?.classList.remove('open');$('#sidetoggle')?.setAttribute('aria-expanded','false');paintShop(true)}
  else if(act==='sidetoggle'){const o=$('#sidewrap').classList.toggle('open');a.setAttribute('aria-expanded',o)}
  else if(act==='cat-go'){shop.cat=a.dataset.v;shop.tag='';shop.q='';location.hash='botiga'}
  else if(act==='tag'){shop.limit=24;shop.tag=shop.tag===a.dataset.v?'':a.dataset.v;paintShop(true)}
  else if(act==='hprev'){window.__heroGo?.(-1)}
  else if(act==='hnext'){window.__heroGo?.(1)}
  else if(act==='hplay'){window.__heroToggle?.()}
  else if(act==='hdot'){window.__heroTo?.(+a.dataset.v)}
  else if(act==='listopen')openList(true);
  else if(act==='listclose')openList(false);
  else if(act==='listmatch')matchList();
  else if(act==='listadd'){addMatches();}
  else if(act==='mode'){co.mode=a.dataset.v;render(true)}
  else if(act==='day'){co.day=+a.dataset.v;co.slot=-1;paintSlots()}
  else if(act==='slot'){co.slot=+a.dataset.v;paintSlots()}
  else if(act==='store'){co.store=+a.dataset.v;location.hash='botiga';toast(L('Botiga seleccionada per preparar la comanda','Tienda seleccionada para preparar el pedido'))}
  else if(act==='place')placeOrder();
  else if(act==='reorder')reorder();
  else if(act==='demo-form'){e.preventDefault();demoForm(a)}
});

/* ---------- Drag-to-dismiss cistella (1:1 tracking, velocity, momentum projection, rubber-band) ---------- */
(function(){
  const d=document.getElementById('drawer');if(!d)return;
  let st=null,hist=[];
  const project=(v,r=.998)=>(v/1000)*r/(1-r);
  const rubber=(o,dim,c=.55)=>(o*dim*c)/(dim+c*Math.abs(o));
  d.addEventListener('pointerdown',e=>{
    if(!d.classList.contains('on')||e.target.closest('input,textarea,select,.dbody button,.dfoot a'))return;
    st={x:e.clientX,y:e.clientY,on:false};hist=[{x:e.clientX,t:e.timeStamp}];
  });
  d.addEventListener('pointermove',e=>{
    if(!st)return;
    const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.on){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      if(Math.abs(dy)>Math.abs(dx)){st=null;return}
      st.on=true;st.x=e.clientX;d.setPointerCapture(e.pointerId);d.classList.add('drag');
    }
    const w=d.offsetWidth,off=e.clientX-st.x;
    d.style.transform=`translateX(${off>=0?off:-rubber(-off,w)}px)`;
    hist.push({x:e.clientX,t:e.timeStamp});if(hist.length>6)hist.shift();
  });
  const end=()=>{
    if(!st)return;const was=st.on;st=null;if(!was)return;
    d.classList.remove('drag');
    const a=hist[0],b=hist[hist.length-1],v=b.t>a.t?(b.x-a.x)/(b.t-a.t)*1000:0;
    const cur=new DOMMatrixReadOnly(getComputedStyle(d).transform).m41;
    const close=cur+project(v)>d.offsetWidth/2;
    d.style.transform=`translateX(${cur}px)`;void d.offsetWidth;
    d.style.transform='';
    if(close)openCart(false);
    hist=[];
  };
  d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end);
})();

document.addEventListener('load',e=>{if(e.target.tagName==='IMG'&&e.target.classList.contains('f'))e.target.classList.add('ld')},true);
(()=>{let q=0;const settle=()=>{q=0;$$('img.f:not(.ld)').forEach(i=>{if(i.complete&&i.naturalWidth)i.classList.add('ld')})};
  new MutationObserver(()=>{if(!q)q=requestAnimationFrame(settle)}).observe(document.body,{childList:true,subtree:true})})();

/* ---------- bouncy entrances: things jump up from below and settle with one organic rebound ---------- */
const REVEAL_SEL='.shead,.acttile,.steps>div,.soc,.band,.card,.phcard,.story,.stat,.docsec,.store,.fee,.sbox,.prod,.smap>*';
let revealIO=null;
function autoReveal(animate){
  const view=$('#view'),r=currentRoute();
  /* never on the shop grid, checkout or confirmation: those are used many times a day or re-render on every click */
  const quiet=!animate||['botiga','comanda','gracies'].includes(r);
  $$(REVEAL_SEL,view).filter(e=>!e.closest('#grid')&&!e.closest('.phead')).forEach(e=>e.classList.add('rv'));
  const all=$$('.rv:not(.in)',view);
  revealIO?.disconnect();
  if(reduce||quiet){all.forEach(e=>e.classList.add('in','now'));return}
  revealIO=new IntersectionObserver(es=>{
    es.filter(e=>e.isIntersecting).sort((a,b)=>a.target.compareDocumentPosition(b.target)&2?1:-1).forEach((e,i)=>{
      e.target.style.setProperty('--d',Math.min(i,5)*80+'ms');e.target.classList.add('in');revealIO.unobserve(e.target)});
  },{threshold:.1,rootMargin:'0px 0px -5% 0px'});
  all.forEach(e=>revealIO.observe(e));
}

function filtered(){
  let a=PRODUCTS.filter(p=>(shop.cat==='all'||p.c===shop.cat)&&(!shop.tag||(shop.tag==='oferta'?p.o:p.tags.includes(shop.tag))));
  const q=norm(shop.q.trim());
  if(q)a=a.filter(p=>norm(p.ca+' '+p.es).includes(q));
  if(shop.sort==='pa')a.sort((x,y)=>unitPrice(x)-unitPrice(y));
  if(shop.sort==='pd')a.sort((x,y)=>unitPrice(y)-unitPrice(x));
  if(shop.sort==='az')a.sort((x,y)=>pname(x).localeCompare(pname(y)));
  return a;
}

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function matchList(){
  const txt=$('#listtxt').value.split('\n').map(s=>s.trim()).filter(Boolean);
  listMatches=txt.map(line=>{
    const m=line.match(/^(\d+(?:[.,]\d+)?)\s*(?:x|kg|u)?\s+(.*)$/i);
    const qty=m?parseFloat(m[1].replace(',','.')):1,term=norm(m?m[2]:line);
    const p=PRODUCTS.find(p=>norm(p.ca+' '+p.es).includes(term))||PRODUCTS.find(p=>term.split(' ').some(w=>w.length>3&&norm(p.ca+' '+p.es).includes(w)));
    return {line,p,qty};
  });
  $('#matches').innerHTML=listMatches.map(r=>`<div class="match"><span>${esc(r.line)}</span><span>${r.p?`<b>${esc(pname(r.p))}</b> · ${eur(unitPrice(r.p))}`:`<em style="color:var(--red-ink)">${L('Sense coincidència','Sin coincidencia')}</em>`}</span></div>`).join('');

}
