<!-- CONTACTE -->
  <section class="sec paper" id="contacte">
    <div class="wide ct-grid">
      <div class="ct-team rv">
        <h2 class="h-sec split">Explica'ns el projecte.</h2>
        <p class="sub">Et responem nosaltres dos, en dos dies feiners, amb una primera valoració. Sense compromís.</p>
        <figure class="ct-photo">
          <img src="img/equip.jpg" alt="Martí Vila i Teo Garcia, l'equip de MNA LABS" width="1600" height="1067" loading="lazy">
          <figcaption>
            <div><b>Martí Vila</b><span>Programador de producció i emprenedor</span></div>
            <div><b>Teo Garcia</b><span>Estudiant de matemàtiques</span></div>
          </figcaption>
        </figure>
      </div>
      <div class="ct-form rv">
        <form id="form" novalidate>
          <div class="row">
            <div class="field"><input id="f-nom" name="nom" autocomplete="name" placeholder=" " required><label for="f-nom">Nom</label></div>
            <div class="field"><input id="f-mail" name="email" type="email" autocomplete="email" placeholder=" " required><label for="f-mail">Correu electrònic</label></div>
          </div>
          <div class="field">
            <select id="f-tipus" name="tipus"><option value="Programari a mida">Programari a mida</option><option value="Plataforma SaaS">Plataforma SaaS</option><option value="App mòbil">App mòbil</option><option value="Web">Web</option><option value="Ecommerce">Ecommerce</option><option value="Xarxes socials">Xarxes socials</option><option value="Prototipatge">Prototipatge</option><option value="Free Developing">Free Developing</option><option value="Venda a Amazon">Venda a Amazon</option><option value="Afiliacions">Afiliacions</option><option value="Emprenedoria aplicada">Emprenedoria aplicada</option><option value="Encara no ho sé">Encara no ho sé</option></select>
            <label for="f-tipus">Què necessites?</label>
          </div>
          <div class="field"><textarea id="f-msg" name="missatge" placeholder=" " required></textarea><label for="f-msg">El projecte, en poques línies</label></div>
          <div class="submit">
            <button class="btn mag" type="submit">Envia la proposta</button>
            <p class="note" id="note" role="status"></p>
            <a class="more" href="mailto:labs.mna@gmail.com">O escriu a labs.mna@gmail.com</a>
            <a class="more" href="https://www.instagram.com/mna_labs" target="_blank" rel="noopener">O parla'ns per Instagram: @mna_labs</a>
          </div>
        </form>
      </div>
    </div>
  </section>
